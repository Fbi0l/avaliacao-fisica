name: Auditoria de seguranca do Supabase

# Somente leitura: confere a configuracao de seguranca do banco oficial (RLS, politicas, permissoes,
# funcoes, gatilhos, buckets) com o usuario auditoria_leitura, que nao le nenhum dado.
# Mesmo modelo do Inventario. Ver AUDITORIA_SUPABASE.md.
# Comeca desligada: o agendamento so roda com a variavel AUDITORIA_ENABLED=true.
on:
  schedule:
    # Toda segunda-feira, 06h50 em Fortaleza (09h50 UTC).
    - cron: '50 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auditoria-supabase
  cancel-in-progress: false

jobs:
  auditoria:
    name: Conferir configuracao de seguranca
    if: github.event_name == 'workflow_dispatch' || vars.AUDITORIA_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Auditar (somente leitura)
        env:
          PGHOST: ${{ vars.SUPABASE_DB_HOST }}
          PGPORT: ${{ vars.SUPABASE_DB_PORT }}
          SUPABASE_DB_USER: ${{ vars.SUPABASE_DB_USER }}
          PGPASSWORD: ${{ secrets.SUPABASE_AUDIT_DB_PASSWORD }}
          PGDATABASE: postgres
          PGSSLMODE: require
          AUDITORIA_USAR_DOCKER: '1'
        run: |
          set -Eeuo pipefail
          if [[ -z "$PGPASSWORD" ]]; then
            echo "::error::Segredo SUPABASE_AUDIT_DB_PASSWORD ausente. Veja AUDITORIA_SUPABASE.md, passo 2."
            exit 2
          fi
          # O pooler do Supabase usa usuario.projeto; o sufixo vem do usuario do backup.
          sufixo=""
          if [[ "$SUPABASE_DB_USER" == *.* ]]; then sufixo=".${SUPABASE_DB_USER#*.}"; fi
          export PGUSER="auditoria_leitura${sufixo}"
          bash scripts/auditoria-supabase.sh
